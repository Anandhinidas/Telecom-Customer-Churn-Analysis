<!DOCTYPE html>
<html>
<head>
    <title>Telecom Churn AI Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; background: #0F1729; color: #E6F1FB; }
        h1 { font-size: 22px; }
        input[type=text] { width: 100%; padding: 12px; font-size: 15px; border-radius: 6px; border: none; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #378ADD; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #2b6cb3; }
        #answer { margin-top: 20px; padding: 16px; background: #1B2436; border-radius: 8px; white-space: pre-wrap; min-height: 40px; }
        #answer ul { margin: 0; padding-left: 20px; }
        #answer strong { color: #9FE1CB; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
</head>
<body>
    <h1>Telecom Customer Churn — AI Query Assistant</h1>
    <input type="text" id="question" placeholder="Ask a question about customer churn..." />
    <button onclick="askQuestion()">Ask</button>
    <div id="answer"></div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value;
            const answerDiv = document.getElementById("answer");
            answerDiv.innerText = "Thinking...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (typeof marked !== "undefined") {
                    answerDiv.innerHTML = marked.parse(data.answer);
                } else {
                    answerDiv.innerText = data.answer;
                }
            } catch (err) {
                answerDiv.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
